<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Aman Raj – Portfolio</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect script:
      // Redirects 404 paths to the repository root with hash routing
      var pathSegmentsToKeep = 1; // 1 for project pages (e.g. /example/)

      var l = window.location;
      var repo = l.pathname.split('/')[1] || '';
      var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');

      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        (repo ? '/' + repo : '') + '/#/' + path + (l.search ? '?' + l.search.slice(1) : '');

      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    <p>Redirecting to Aman Raj Portfolio...</p>
  </body>
</html>
